name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./tools/release-notes.ps1 -Tag $env:RELEASE_TAG -OutputPath release-notes.md
      - name: Build and test
        run: ./tools/build.ps1 -RunTests
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            dist/Imago-*-windows-x64.zip
            dist/Imago-*-windows-x64.zip.sha256
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Publish complete package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="Imago-${version}-windows-x64.zip"
          (cd release/dist && sha256sum --check "${package}.sha256")
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'This version is already published. Published releases are not overwritten.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Imago $RELEASE_TAG" --notes-file release/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "release/dist/$package" "release/dist/${package}.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
